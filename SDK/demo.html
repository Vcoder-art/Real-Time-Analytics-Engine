  <body>

      import Analytics from "/dist/index.js";
      const sdk = new Analytics({

        debug: true,
      });

      sdk.identify("abhinash012@gmail.com","abhinash singh");

      document.getElementById("track").addEventListener("click", () => {
        sdk.track("button_clicked", { time: new Date().toISOString() });
      });

      document.getElementById("track2").addEventListener("click", () => {
        sdk.track("login_clicked", { time: new Date().toISOString() });
      });

       document.getElementById("track3").addEventListener("click", () => {
        sdk.track("register_clicked", { time: new Date().toISOString() });
      });

      document.getElementById("track4").addEventListener("click", () => {
        sdk.track("transaction_clicked", { time: new Date().toISOString() });
      });
